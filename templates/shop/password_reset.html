{% extends 'shop/base.html' %}
{% block content %}
<h2>Відновлення пароля</h2>
<p>Введіть вашу email адресу, і ми надішлемо інструкції для створення нового пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Скинути пароль</button>
</form>
{% endblock %}
